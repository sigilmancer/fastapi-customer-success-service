name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest httpx

    - name: Run Test Suite
      run: python -m pytest -v

    - name: Open Tracking Ticket on Failure
      if: failure()
      uses: actions-ecosystem/action-create-issue@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        title: "automated CI Build Failure on main"
        labels: bug, automated-ci
        body: |
          ### Test Suite execution failure
          
          The integration tests failed during runtime on the latest push. 
          
          Inspect the **Actions logs** to determine the failing assertion and push a repair commit to clear this block.

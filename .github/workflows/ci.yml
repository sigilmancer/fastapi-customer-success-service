name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest httpx

    - name: Run Test Suite
      run: python -m pytest -v

    - name: Open Tracking Ticket on Failure
      if: failure()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh issue create \
          --title "CI Pipeline failed on [${{ github.ref_name }}]" \
          --assignee "${{ github.actor }}" \
          --label "bug" \
          --body "The test suite has failed during runtime execution. Please check your repository Actions log tab to isolate and repair the failing test assertion."